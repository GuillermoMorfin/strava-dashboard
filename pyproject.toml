[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strava-dashboard"
version = "0.1.0"
license = "MIT"
description = "Pull your Strava runs into DuckDB and explore them in a Streamlit dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
strava-dash = "strava_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strava_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
